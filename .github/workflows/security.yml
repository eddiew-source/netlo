name: Security and build checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, full 40-char SHA
        with:
          persist-credentials: false
      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
      - name: Require a committed lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo '::error file=package.json::package-lock.json is missing. Run npm install locally and commit the lockfile for reproducible security scans.'
            exit 1
          fi
      - name: Install exactly from lockfile
        run: npm ci --no-fund
      - name: Check high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Security regression tests
        run: npm run test:security
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
